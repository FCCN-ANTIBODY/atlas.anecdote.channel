name: "Publish · site"

on:
  # Shell/template/registry changes only. Data slices are fetched at runtime
  # (see assets/atlas.js), so a pile's data update never rebuilds this site —
  # that decouples build cadence from the ~10-minute, per-pile data trickle.
  push:
    branches-ignore:
      # Per-pile data branches: piles push signed artifacts to their own
      # pile/<scope>/<id> ref out-of-band, and these commits must never trigger a
      # Pages build (keeps builds narrow — N piles never cause N rebuilds).
      - 'pile/**'
      # Peer-registration branches (a peer Atlas's atlas/<scope>/<id> introduction PR)
      # and inbound request "bill" branches (request/<scope>/<id>, examine-not-merge):
      # both are signal channels, never site content — they must not spawn a build.
      - 'atlas/**'
      - 'request/**'
  # Manual rebuild.
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight run finish (don't cancel,
# so a dispatch-triggered publish isn't dropped).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # THE DIRECTORY, BUILT HERE BECAUSE IT IS ATLAS'S OFFICE. Probes every host in
      # config/sites.txt, resolves the repo: entries, and writes sites.json for directory.html to
      # render. It also FAILS when a listed host has no TLS coverage in config/san-list.txt — that
      # failure is the guard that stops a name being published before its certificate exists, so it
      # must stay fatal. anecdote.channel embeds the result rather than generating it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the directory
        env:
          # repo: entries resolve through the GitHub API. Unauthenticated is 60 requests an hour,
          # and a rate-limited lookup reads exactly like a site that is not there — the entry
          # vanishes from the directory rather than erroring.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-sites.mjs

      - name: Build site
        # Build only the static shell + the piles.json manifest; no data fetch
        # happens at build time. Use the committed binstub: bare
        # `bundle exec jekyll` fails to resolve the executable under the Bundler
        # 4.0.9 pinned in Gemfile.lock.
        run: bin/jekyll build --trace

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only publish from the default branch or a manual run; feature-branch
    # pushes validate the build above without deploying.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
